// ── MIGRATION ───────────────────────────────────────────────

function log(msg, type = 'ok') {
    const div = document.getElementById('log');
    const line = document.createElement('div');
    line.className = type;
    line.textContent = msg;
    div.appendChild(line);
    div.scrollTop = div.scrollHeight;
}

window.startMigration = async function() {
    const btn = document.getElementById('start-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Migration en cours…';

    // Demander email/mdp
    const email = prompt('Ton email Firebase admin :');
    const pwd   = prompt('Ton mot de passe :');
    if (!email || !pwd) { log('❌ Annulé.', 'err'); btn.disabled = false; return; }

    try {
        log('🔐 Connexion à Firebase…', 'info');
        await signInWithEmailAndPassword(auth, email, pwd);
        log('✅ Connecté !', 'ok');
    } catch(e) {
        log('❌ Connexion échouée : ' + e.message, 'err');
        btn.disabled = false;
        return;
    }

    // Vérifier si déjà migré
    try {
        const existingCl = await getDocs(collection(db, 'classement'));
        if (!existingCl.empty) {
            const confirm = window.confirm(`⚠️ Il y a déjà ${existingCl.size} joueur(s) dans Firestore. Continuer quand même risque de créer des doublons. Continuer ?`);
            if (!confirm) { log('⛔ Migration annulée.', 'err'); btn.disabled = false; return; }
        }
    } catch(e) {}

    // CLASSEMENT
    log('📊 Migration du classement (' + CLASSEMENT.length + ' joueurs)…', 'info');
    let ok = 0;
    for (const joueur of CLASSEMENT) {
        try {
            await addDoc(collection(db, 'classement'), { ...joueur, createdAt: Date.now() });
            log('  ✅ ' + joueur.prenom + ' ' + joueur.nom);
            ok++;
        } catch(e) {
            log('  ❌ ' + joueur.nom + ' : ' + e.message, 'err');
        }
    }
    log('✅ Classement : ' + ok + '/' + CLASSEMENT.length + ' joueurs migrés', 'ok');

    // CALENDRIER
    log('📅 Migration du calendrier (' + CALENDRIER.length + ' événements)…', 'info');
    ok = 0;
    for (const evt of CALENDRIER) {
        try {
            await addDoc(collection(db, 'calendrier'), { ...evt, createdAt: Date.now() });
            log('  ✅ ' + evt.nom + ' (' + evt.mois + '/' + evt.jour + ')');
            ok++;
        } catch(e) {
            log('  ❌ ' + evt.nom + ' : ' + e.message, 'err');
        }
    }
    log('✅ Calendrier : ' + ok + '/' + CALENDRIER.length + ' événements migrés', 'ok');

    // FAQ
    log('❓ Migration de la FAQ (' + FAQ.length + ' questions)…', 'info');
    ok = 0;
    for (const faq of FAQ) {
        try {
            await addDoc(collection(db, 'faq'), { ...faq, createdAt: Date.now() });
            log('  ✅ ' + faq.question.substring(0, 50) + '…');
            ok++;
        } catch(e) {
            log('  ❌ ' + faq.question.substring(0,30) + ' : ' + e.message, 'err');
        }
    }
    log('❓ FAQ : ' + ok + '/' + FAQ.length + ' questions migrées', 'ok');

    log('', 'ok');
    log('🎉 MIGRATION TERMINÉE ! Tu peux fermer cette page.', 'ok');
    log('⚠️ Supprime maintenant les données codées en dur dans index.html', 'info');
    btn.textContent = '✅ Migration terminée';
};
